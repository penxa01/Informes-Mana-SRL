<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mana Pedidos</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="pantalla" id="pantalla-login">
    <div class="tarjeta-login">
      <img class="logo" src="icons/icon-192.png" alt="">
      <h1>Mana Pedidos</h1>
      <p class="subtitulo">Iniciá sesión para cargar un pedido</p>
      <form id="form-login">
        <div>
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required>
        </div>
        <div>
          <label for="clave">Clave</label>
          <input id="clave" name="clave" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Entrar</button>
        <p class="error" id="error-login" hidden></p>
      </form>
    </div>
  </main>

  <main class="pantalla" id="pantalla-app" hidden>
    <header class="encabezado">
      <strong id="nombre-usuario"></strong>
      <button id="btn-salir" class="boton-link" type="button">Salir</button>
    </header>
    <div class="contenido">
      <input id="buscar-cliente" type="search" placeholder="Buscar cliente por nombre o CUIT" autocomplete="off">
      <p class="estado-catalogo" id="estado-catalogo"></p>
      <ul class="lista-clientes" id="lista-clientes"></ul>
    </div>
  </main>

  <main class="pantalla" id="pantalla-pedido" hidden>
    <header class="encabezado">
      <button id="btn-volver-pedido" class="boton-link" type="button">← Volver</button>
      <strong id="cliente-pedido"></strong>
    </header>
    <div class="contenido">
      <input id="buscar-producto" type="search" placeholder="Buscar producto" autocomplete="off">
      <ul class="lista-productos" id="lista-productos"></ul>

      <h2 class="titulo-carrito">Pedido</h2>
      <ul class="carrito" id="carrito"></ul>
      <p class="carrito-vacio" id="carrito-vacio">Todavía no agregaste productos</p>

      <p class="error" id="error-pedido" hidden></p>
      <p class="mensaje-ok" id="mensaje-pedido-ok" hidden></p>
      <button id="btn-confirmar-pedido" class="boton-primario" type="button">Confirmar pedido</button>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/pedido.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
